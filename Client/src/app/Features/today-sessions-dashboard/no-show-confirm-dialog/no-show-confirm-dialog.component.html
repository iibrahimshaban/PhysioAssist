<p-dialog
  [header]="'NO_SHOW_DIALOG.HEADER' | translate"
  [(visible)]="visibleModel"
  [modal]="true"
  [style]="{ width: '420px' }"
  (onHide)="cancelled.emit()"
>
  <p class="text-sm text-slate-600 mb-4">
    {{ 'NO_SHOW_DIALOG.DESCRIPTION' | translate: { patientName: patientName() } }}
  </p>

  <div class="space-y-3">
    <label class="flex items-start gap-2 cursor-pointer">
      <p-radiobutton name="noShowMode" [value]="true" [(ngModel)]="countsAsUsed" inputId="counts" />
      <span class="text-sm text-slate-700">
        <span class="font-semibold block">{{
          'NO_SHOW_DIALOG.COUNTS_AS_USED_TITLE' | translate
        }}</span>
        {{ 'NO_SHOW_DIALOG.COUNTS_AS_USED_DESC' | translate }}
      </span>
    </label>

    <label class="flex items-start gap-2 cursor-pointer">
      <p-radiobutton
        name="noShowMode"
        [value]="false"
        [(ngModel)]="countsAsUsed"
        inputId="reopen"
      />
      <span class="text-sm text-slate-700">
        <span class="font-semibold block">{{ 'NO_SHOW_DIALOG.REOPEN_TITLE' | translate }}</span>
        {{ 'NO_SHOW_DIALOG.REOPEN_DESC' | translate }}
      </span>
    </label>
  </div>

  <div class="flex justify-end gap-2 mt-6">
    <p-button
      [label]="'NO_SHOW_DIALOG.CANCEL' | translate"
      [text]="true"
      (onClick)="visibleModel = false"
    />
    <p-button
      [label]="'NO_SHOW_DIALOG.CONFIRM' | translate"
      severity="danger"
      (onClick)="onConfirm()"
    />
  </div>
</p-dialog>
