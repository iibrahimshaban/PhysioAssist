<div
  class="appointment-card"
  [class.appointment-card--booked]="appointment().status === 'Booked'"
  [class.appointment-card--completed]="appointment().status === 'Completed'"
  [class.appointment-card--cancelled]="appointment().status === 'Cancelled'"
  [class.appointment-card--noshow]="appointment().status === 'NoShow'"
  [class.appointment-card--patient]="owner().kind === 'patient'"
  [class.appointment-card--guest]="owner().kind === 'guest'"
  [class.appointment-card--dragging]="dragging()"
  [class.appointment-card--compact]="height() < 40"
  [style.top.px]="top()"
  [style.height.px]="height()"
  [attr.aria-label]="owner().name + ', ' + timeLabel + ', ' + appointment().status"
  tabindex="0"
  (click)="onCardClick()"
  (keydown.enter)="onCardClick()"
  (pointerdown)="onDragHandlePointerDown($event)"
>
  <div class="appointment-card__accent-icon" aria-hidden="true">
    <i class="pi" [ngClass]="statusIcon"></i>
  </div>

  <div class="appointment-card__body">
    <span class="appointment-card__name">{{ owner().name }}</span>
    <span class="appointment-card__meta">
      <i class="pi pi-clock" aria-hidden="true"></i>
      {{ timeLabel }} · {{ durationLabel }}
    </span>
  </div>

  <span class="appointment-card__status-tag" [class]="'appointment-card__status-tag--' + appointment().status.toLowerCase()">
    {{ appointment().status }}
  </span>

  @if (appointment().status === 'Booked') {
    <div class="appointment-card__hover-actions">
      <button
        type="button"
        class="hover-action hover-action--success"
        (click)="onQuickComplete($event)"
        pTooltip="Mark completed"
        tooltipPosition="top"
        aria-label="Mark appointment completed"
      >
        <i class="pi pi-check" aria-hidden="true"></i>
      </button>
      <button
        type="button"
        class="hover-action hover-action--danger"
        (click)="onQuickCancel($event)"
        pTooltip="Cancel appointment"
        tooltipPosition="top"
        aria-label="Cancel appointment"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </div>
  }

  <div
    class="appointment-card__resize-handle"
    (pointerdown)="onResizeHandlePointerDown($event)"
    aria-hidden="true"
  ></div>
</div>

<app-confirm-dialog
  [isOpen]="pendingAction() !== null"
  [title]="pendingAction()?.title ?? ''"
  [message]="pendingAction()?.message ?? ''"
  [tone]="pendingAction()?.tone ?? 'default'"
  confirmLabel="Yes"
  (confirmed)="onConfirmed()"
  (cancelled)="onCancelled()"
/>
