<div class="filters-bar">
  <span class="filters-bar__search">
    <i class="pi pi-search filters-bar__search-icon"></i>
    <input
      type="text"
      class="filters-bar__search-input"
      [placeholder]="'FILTERS_BAR.SEARCH_PLACEHOLDER' | translate"
      [value]="filters().patientSearch"
      (input)="onSearchChange($event)"
      [attr.aria-label]="'FILTERS_BAR.SEARCH_ARIA' | translate"
    />
  </span>

  <div class="filters-bar__chips">
    <div
      class="filters-bar__statuses"
      role="group"
      [attr.aria-label]="'FILTERS_BAR.STATUS_FILTER_ARIA' | translate"
    >
      @for (status of statusOptions; track status) {
        <button
          type="button"
          class="filter-chip"
          [class.filter-chip--active]="isActive(status)"
          [attr.aria-pressed]="isActive(status)"
          (click)="onToggleStatus(status)"
        >
          {{ 'APPOINTMENT_STATUS.' + status.toUpperCase() | translate }}
        </button>
      }
    </div>

    <button
      type="button"
      class="filter-chip filter-chip--today"
      [class.filter-chip--active]="filters().showOnlyToday"
      [attr.aria-pressed]="filters().showOnlyToday"
      (click)="onToggleToday()"
    >
      <i class="pi pi-calendar-plus"></i>
      {{ 'FILTERS_BAR.TODAY_ONLY' | translate }}
    </button>

    <button
      type="button"
      class="filters-bar__clear"
      [pTooltip]="'FILTERS_BAR.RESET_TOOLTIP' | translate"
      tooltipPosition="top"
      (click)="clearRequested.emit()"
    >
      <i class="pi pi-filter-slash"></i>
      <span>{{ 'FILTERS_BAR.CLEAR' | translate }}</span>
    </button>
  </div>
</div>
