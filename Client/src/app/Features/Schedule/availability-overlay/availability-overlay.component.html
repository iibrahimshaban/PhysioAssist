<div
  class="availability-block"
  [style.top.px]="top()"
  [style.height.px]="height()"
  (click)="onClick()"
  role="button"
  tabindex="0"
  (keydown.enter)="onClick()"
  (keydown.space)="onClick()"
  [attr.aria-label]="'AVAILABILITY_BLOCK.ARIA_LABEL' | translate"
  [attr.title]="'AVAILABILITY_BLOCK.TITLE' | translate"
>
  <span class="availability-block__label">
    <i class="pi pi-plus-circle" aria-hidden="true"></i>
    {{ 'AVAILABILITY_BLOCK.AVAILABLE' | translate }}
  </span>
</div>
