@if (isOpen()) {
  <div class="confirm-backdrop" (click)="onCancel()"></div>
  <div class="confirm-dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="title()">
    <div class="confirm-dialog__icon" [class]="'confirm-dialog__icon--' + tone()">
      <i class="pi" [class.pi-check-circle]="tone() === 'success'" [class.pi-exclamation-triangle]="tone() === 'warning'"
         [class.pi-times-circle]="tone() === 'danger'" [class.pi-info-circle]="tone() === 'default'"></i>
    </div>

    <h3 class="confirm-dialog__title">{{ title() }}</h3>
    @if (message()) {
      <p class="confirm-dialog__message">{{ message() }}</p>
    }

    <div class="confirm-dialog__actions">
      <button type="button" class="confirm-btn" (click)="onCancel()">{{ cancelLabel() }}</button>
      <button type="button" class="confirm-btn" [class]="'confirm-btn--' + tone()" (click)="onConfirm()">
        {{ confirmLabel() }}
      </button>
    </div>
  </div>
}
