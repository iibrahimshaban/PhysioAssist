<div class="toolbar">
  <div class="toolbar__heading">
    <h1 class="toolbar__title">Schedule</h1>
    <p class="toolbar__subtitle">
      <i class="pi pi-calendar" aria-hidden="true"></i>
      {{ dateRangeLabel() }}
    </p>
  </div>

  <div class="toolbar__controls">
    <div class="view-switch" role="group" aria-label="Calendar view">
      @for (option of viewOptions; track option.mode) {
        <button
          type="button"
          class="view-switch__btn"
          [class.view-switch__btn--active]="viewMode() === option.mode"
          (click)="onViewModeSelect(option.mode)"
        >
          <i class="pi" [class.pi-calendar]="option.mode === 'week'" [class.pi-sun]="option.mode === 'day'" aria-hidden="true"></i>
          <span>{{ option.label }}</span>
        </button>
      }
    </div>

    <div class="date-nav">
      <button
        type="button"
        class="date-nav__btn"
        (click)="onPrevious()"
        aria-label="Previous"
        pTooltip="Previous"
        tooltipPosition="bottom"
      >
        <i class="pi pi-chevron-left"></i>
      </button>
      <button type="button" class="date-nav__today" (click)="onToday()">Today</button>
      <button
        type="button"
        class="date-nav__btn"
        (click)="onNext()"
        aria-label="Next"
        pTooltip="Next"
        tooltipPosition="bottom"
      >
        <i class="pi pi-chevron-right"></i>
      </button>
    </div>
  </div>
</div>
