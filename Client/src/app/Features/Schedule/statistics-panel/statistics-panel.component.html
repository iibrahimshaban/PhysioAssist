<div class="stats-panel">
  <div class="stat-card">
    <span class="stat-card__label">Appointments Today</span>
    <span class="stat-card__value">{{ statistics().appointmentsToday }}</span>
  </div>

  <div class="stat-card">
    <span class="stat-card__label">Working Hours</span>
    <span class="stat-card__value stat-card__value--small">{{ workingHoursLabel }}</span>
  </div>
  <div class="stat-card">
    <span class="stat-card__label">Free Time Remaining</span>
    <span class="stat-card__value">{{ statistics().freeMinutesRemaining }} min</span>
  </div>

 @if (upcomingAppointment(); as next) {
  <div class="stat-card stat-card--highlight">
    <span class="stat-card__label">Upcoming Appointment</span>
    <span class="stat-card__value stat-card__value--small">{{ formatTime(next.slotStart) }} · {{ ownerName(next) }}</span>
  </div>
}
  
</div>
