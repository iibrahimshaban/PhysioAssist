<select class="doctor-selector" [value]="selectedDoctorId() ?? ''" (change)="onSelect($event)">
  <option value="" disabled>{{ 'DOCTOR_SELECTOR.SELECT_DOCTOR' | translate }}</option>
  @for (doctor of doctors(); track doctor.id) {
    <option [value]="doctor.id">{{ doctor.displayLabel }}</option>
  }
</select>
