<div class="min-h-screen bg-[#f5fafc] p-6">
  <div class="mx-auto max-w-3xl">

    <div class="mb-6 flex items-center gap-4">
      <button (click)="goBack()"
        class="inline-flex items-center gap-1 text-slate-400 hover:text-slate-600 transition-colors text-sm">
        <i class="pi pi-arrow-left"></i> Back
      </button>
      <div>
        <h1 class="text-3xl font-bold text-slate-900">Add Patient</h1>
        <p class="mt-1 text-sm text-slate-500">Fill out the intake form to register a new patient.</p>
      </div>
    </div>

    <div *ngIf="isLoadingSchemas" class="py-20 text-center text-slate-400">
      <i class="pi pi-spin pi-spinner text-2xl"></i>
      <p class="mt-2 text-sm">Loading forms...</p>
    </div>

    <div *ngIf="!isLoadingSchemas && availableSchemas.length === 0"
      class="rounded-3xl border border-slate-200 bg-white p-6 text-center text-slate-400">
      <i class="pi pi-inbox text-2xl mb-2 block"></i>
      <p class="text-sm">No intake forms found. Please create and publish one first.</p>
    </div>

    <div *ngIf="!isLoadingSchemas && availableSchemas.length > 0">

      <div class="mb-4 rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
  <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Intake Form</label>
  <p-select
    [options]="availableSchemas"
    optionLabel="name"
    optionValue="id"
    [(ngModel)]="selectedSchemaId"
    (onChange)="onSchemaSelected()"
    styleClass="w-full !rounded-xl !border-slate-200"
    placeholder="Select an intake form">
  </p-select>
</div>

      <div *ngIf="isLoadingForm" class="py-16 text-center text-slate-400">
        <i class="pi pi-spin pi-spinner text-2xl"></i>
        <p class="mt-2 text-sm">Loading form...</p>
      </div>

      <div *ngIf="!isLoadingForm && errorMessage && !formSchema"
        class="rounded-3xl border border-red-100 bg-red-50 p-6 text-center text-red-600">
        <i class="pi pi-exclamation-triangle text-2xl mb-2 block"></i>
        <p class="text-sm">{{ errorMessage }}</p>
      </div>

      <div *ngIf="!isLoadingForm && formSchema" class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
        <app-dynamic-form-renderer
          [schema]="formSchema"
          [formSchemaId]="selectedSchemaId ?? ''"
          [formSchemaVersion]="formSchemaVersion"
          (submissionChange)="onSubmissionChange($event)">
        </app-dynamic-form-renderer>

        <div *ngIf="errorMessage" class="mt-4 rounded-xl bg-red-50 border border-red-100 p-3 text-sm text-red-600">
          {{ errorMessage }}
        </div>

        <div class="flex gap-3 mt-4">
          <button (click)="submit()" [disabled]="isSubmitting"
            class="px-6 py-2.5 rounded-lg bg-[#0B8EEA] text-white text-sm font-semibold hover:bg-[#0a7ed1] disabled:opacity-60">
            {{ isSubmitting ? 'Creating...' : 'Create Patient' }}
          </button>
          <button (click)="goBack()" [disabled]="isSubmitting"
            class="px-6 py-2.5 rounded-lg border border-slate-200 bg-white text-sm font-semibold text-slate-700 hover:bg-slate-50">
            Cancel
          </button>
        </div>
      </div>

    </div>

  </div>
</div>
