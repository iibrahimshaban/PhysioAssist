<div class="bg-white border border-slate-200 rounded-2xl p-5 mb-5">
  <p class="text-xs font-semibold text-slate-400 uppercase tracking-wide">
    {{ 'PATIENT_FREE_TIMES.TITLE' | translate }}
  </p>
  <p class="text-sm text-slate-400 mt-1">
    {{ 'PATIENT_FREE_TIMES.SUBTITLE' | translate }}
  </p>

  <textarea
    pTextarea
    rows="2"
    class="w-full mt-3 text-sm"
    [placeholder]="'PATIENT_FREE_TIMES.PLACEHOLDER' | translate"
    [ngModel]="freeTimeText()"
    (ngModelChange)="freeTimeText.set($event)"
  ></textarea>

  <div class="flex items-center justify-between mt-4">
    <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
      <p-checkbox
        [ngModel]="persistOverride()"
        (ngModelChange)="persistOverride.set($event)"
        [binary]="true"
      />
      {{ 'PATIENT_FREE_TIMES.UPDATE_SAVED' | translate }}
    </label>

    <p-button
      [label]="'PATIENT_FREE_TIMES.REFRESH_SLOTS' | translate"
      icon="pi pi-search"
      size="small"
      (onClick)="refresh.emit({ text: freeTimeText(), persist: persistOverride() })"
    />
  </div>
</div>
