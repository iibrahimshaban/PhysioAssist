<button
  type="button"
  (click)="selected.emit(submission)"
  class="submission-row-card">
  <div class="submission-row-main">
    <div class="avatar-chip submission-row-avatar">
      {{ getInitials(submission.patientName) }}
    </div>
    <div class="submission-row-body">
      <div class="submission-row-header">
        <span class="submission-row-name">{{ submission.patientName || 'Unnamed patient' }}</span>
        <span class="status-badge submission-row-badge" [ngClass]="getStatusPillClass(submission.status)">
          {{ getQueueStatusLabel(submission.status) }}
        </span>
      </div>
      <p class="submission-row-meta">
        <span class="submission-row-meta-item">
          <i class="pi pi-clock" aria-hidden="true"></i>
          Checked in {{ timeAgo(submission.submittedAt) }}
        </span>
        <span class="submission-row-meta-sep" aria-hidden="true">&middot;</span>
        <span class="submission-row-meta-item">{{ submission.painRegionCount }} pain region(s)</span>
      </p>
    </div>
  </div>
  <span class="submission-row-chevron" aria-hidden="true">
    <i class="pi pi-chevron-right"></i>
  </span>
</button>
