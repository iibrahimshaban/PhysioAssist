<button
  type="button"
  (click)="selected.emit(submission)"
  class="submission-card-item">

  <!-- Left: Avatar + Details -->
  <div class="submission-card-main">
    <!-- Gradient Avatar -->
    <div
      class="submission-card-avatar"
      [style.background]="getAvatarGradient(submission.patientName, submission.id)">
      {{ getInitials(submission.patientName) }}
    </div>

    <!-- Info Block -->
    <div class="submission-card-body">
      <!-- Title + Badges -->
      <div class="submission-card-header">
        <h4 class="submission-card-name">
          {{ getDisplayName(submission) }}
        </h4>

        @if (submission.shortCode) {
          <span class="submission-code-badge">
            {{ getShortCodeDisplay(submission.shortCode) }}
          </span>
        }

        <span class="status-badge submission-card-badge" [ngClass]="getStatusPillClass(submission.status)">
          {{ getQueueStatusLabel(submission.status) }}
        </span>
      </div>

      <!-- Metadata Line -->
      <div class="submission-card-meta">
        <span class="meta-item">
          <i class="pi pi-clock" aria-hidden="true"></i>
          Submitted {{ timeAgo(submission.submittedAt) }}
        </span>

        <span class="meta-sep" aria-hidden="true">&bull;</span>

        <span class="meta-item">
          <i class="pi pi-heart" aria-hidden="true"></i>
          {{ submission.painRegionCount }} pain {{ submission.painRegionCount === 1 ? 'region' : 'regions' }}
        </span>
      </div>
    </div>
  </div>

  <!-- Right: Hover Action Chevron -->
  <div class="submission-card-action">
    <span class="action-label hidden md:inline-block">View Details</span>
    <div class="action-icon-box">
      <i class="pi pi-arrow-right text-xs"></i>
    </div>
  </div>
</button>
