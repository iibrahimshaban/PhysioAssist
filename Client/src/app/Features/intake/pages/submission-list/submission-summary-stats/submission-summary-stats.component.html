@if (!loading) {
  <div class="metrics-bar">
    @if (mode === 'archive') {
      <!-- Total Submissions -->
      <button type="button" class="metric-item" [class.active]="selectedStatus === null" (click)="onCardClick(null)">
        <i class="pi pi-inbox metric-icon metric-icon--total"></i>
        <div class="metric-content">
          <span class="metric-value">{{ totalCount }}</span>
          <span class="metric-label">Total Submissions</span>
        </div>
      </button>

      <!-- Pending -->
      <button type="button" class="metric-item" [class.active]="selectedStatus === IntakeStatus.Pending" (click)="onCardClick(IntakeStatus.Pending)">
        <i class="pi pi-clock metric-icon metric-icon--pending"></i>
        <div class="metric-content">
          <span class="metric-value">{{ pendingCount }}</span>
          <span class="metric-label">Pending</span>
        </div>
        @if (pendingCount > 0) {
          <span class="metric-dot"></span>
        }
      </button>

      <!-- In Review -->
      <button type="button" class="metric-item" [class.active]="selectedStatus === IntakeStatus.InReview" (click)="onCardClick(IntakeStatus.InReview)">
        <i class="pi pi-eye metric-icon metric-icon--review"></i>
        <div class="metric-content">
          <span class="metric-value">{{ inReviewCount }}</span>
          <span class="metric-label">In Review</span>
        </div>
      </button>

      <!-- Approved -->
      <button type="button" class="metric-item" [class.active]="selectedStatus === IntakeStatus.Approved" (click)="onCardClick(IntakeStatus.Approved)">
        <i class="pi pi-check-circle metric-icon metric-icon--approved"></i>
        <div class="metric-content">
          <span class="metric-value">{{ approvedCount }}</span>
          <span class="metric-label">Approved</span>
        </div>
      </button>
    } @else {
      <!-- Waiting -->
      <button type="button" class="metric-item" [class.active]="selectedStatus === IntakeStatus.Pending" (click)="onCardClick(IntakeStatus.Pending)">
        <i class="pi pi-clock metric-icon metric-icon--pending"></i>
        <div class="metric-content">
          <span class="metric-value">{{ pendingCount }}</span>
          <span class="metric-label">Waiting</span>
        </div>
        @if (pendingCount > 0) {
          <span class="metric-dot"></span>
        }
      </button>

      <!-- In Review -->
      <button type="button" class="metric-item" [class.active]="selectedStatus === IntakeStatus.InReview" (click)="onCardClick(IntakeStatus.InReview)">
        <i class="pi pi-eye metric-icon metric-icon--review"></i>
        <div class="metric-content">
          <span class="metric-value">{{ inReviewCount }}</span>
          <span class="metric-label">In Review</span>
        </div>
      </button>

      <!-- Today's Arrivals -->
      <div class="metric-item">
        <i class="pi pi-calendar metric-icon metric-icon--total"></i>
        <div class="metric-content">
          <span class="metric-value">{{ todayCount }}</span>
          <span class="metric-label">Today's Arrivals</span>
        </div>
      </div>
    }
  </div>
}
