@if (!loading) {
  <div class="stats-grid mb-6">
    @if (mode === 'archive') {
      <!-- Card 1: Total -->
      <button
        type="button"
        class="stat-card stat-card--total"
        [class.active]="selectedStatus === null"
        (click)="onCardClick(null)">
        <div class="stat-card-icon-wrapper">
          <i class="pi pi-inbox text-lg"></i>
        </div>
        <div class="stat-card-info">
          <span class="stat-card-label">Total Submissions</span>
          <div class="stat-card-value-group">
            <span class="stat-card-value">{{ totalCount }}</span>
            <span class="stat-card-badge">All</span>
          </div>
        </div>
      </button>

      <!-- Card 2: Pending Review -->
      <button
        type="button"
        class="stat-card stat-card--pending"
        [class.active]="selectedStatus === IntakeStatus.Pending"
        (click)="onCardClick(IntakeStatus.Pending)">
        <div class="stat-card-icon-wrapper">
          <i class="pi pi-clock text-lg"></i>
        </div>
        <div class="stat-card-info">
          <span class="stat-card-label">Pending Review</span>
          <div class="stat-card-value-group">
            <span class="stat-card-value text-amber-600 dark:text-amber-400">{{ pendingCount }}</span>
            @if (pendingCount > 0) {
              <span class="stat-card-pulse-dot bg-amber-500"></span>
            }
          </div>
        </div>
      </button>

      <!-- Card 3: In Review -->
      <button
        type="button"
        class="stat-card stat-card--review"
        [class.active]="selectedStatus === IntakeStatus.InReview"
        (click)="onCardClick(IntakeStatus.InReview)">
        <div class="stat-card-icon-wrapper">
          <i class="pi pi-eye text-lg"></i>
        </div>
        <div class="stat-card-info">
          <span class="stat-card-label">In Review</span>
          <div class="stat-card-value-group">
            <span class="stat-card-value text-indigo-600 dark:text-indigo-400">{{ inReviewCount }}</span>
          </div>
        </div>
      </button>

      <!-- Card 4: Approved -->
      <button
        type="button"
        class="stat-card stat-card--approved"
        [class.active]="selectedStatus === IntakeStatus.Approved"
        (click)="onCardClick(IntakeStatus.Approved)">
        <div class="stat-card-icon-wrapper">
          <i class="pi pi-check-circle text-lg"></i>
        </div>
        <div class="stat-card-info">
          <span class="stat-card-label">Approved</span>
          <div class="stat-card-value-group">
            <span class="stat-card-value text-emerald-600 dark:text-emerald-400">{{ approvedCount }}</span>
          </div>
        </div>
      </button>
    } @else {
      <!-- Card 1: Waiting (Active queue Pending) -->
      <button
        type="button"
        class="stat-card stat-card--pending"
        [class.active]="selectedStatus === IntakeStatus.Pending"
        (click)="onCardClick(IntakeStatus.Pending)">
        <div class="stat-card-icon-wrapper">
          <i class="pi pi-clock text-lg"></i>
        </div>
        <div class="stat-card-info">
          <span class="stat-card-label">Waiting</span>
          <div class="stat-card-value-group">
            <span class="stat-card-value text-amber-600 dark:text-amber-400">{{ pendingCount }}</span>
            @if (pendingCount > 0) {
              <span class="stat-card-pulse-dot bg-amber-500"></span>
            }
          </div>
        </div>
      </button>

      <!-- Card 2: In Review -->
      <button
        type="button"
        class="stat-card stat-card--review"
        [class.active]="selectedStatus === IntakeStatus.InReview"
        (click)="onCardClick(IntakeStatus.InReview)">
        <div class="stat-card-icon-wrapper">
          <i class="pi pi-eye text-lg"></i>
        </div>
        <div class="stat-card-info">
          <span class="stat-card-label">In Review</span>
          <div class="stat-card-value-group">
            <span class="stat-card-value text-indigo-600 dark:text-indigo-400">{{ inReviewCount }}</span>
          </div>
        </div>
      </button>

      <!-- Card 3: Today -->
      <div class="stat-card stat-card--total cursor-default">
        <div class="stat-card-icon-wrapper">
          <i class="pi pi-calendar text-lg"></i>
        </div>
        <div class="stat-card-info">
          <span class="stat-card-label">Today's Arrivals</span>
          <div class="stat-card-value-group">
            <span class="stat-card-value text-emerald-600 dark:text-emerald-400">{{ todayCount }}</span>
          </div>
        </div>
      </div>
    }
  </div>
}
