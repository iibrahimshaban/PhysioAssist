<!-- Filters -->
<div class="intake-filters-bar mb-5">
  <div class="relative flex-1 min-w-0 intake-search-wrapper">
    <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-[var(--color-text-secondary)] text-sm pointer-events-none"></i>
    <input
      type="search"
      [ngModel]="searchTerm"
      (ngModelChange)="searchChange.emit($event)"
      placeholder="Search by patient name..."
      class="intake-search-input"
      aria-label="Search submissions"
      #searchInput />
  </div>

  <!-- Pill-scroll wrapper: hides native scrollbar, only scrolls on genuinely narrow screens -->
  <div class="filter-pill-scroller">
    <div class="segmented-control" role="group" aria-label="Filter by status">
      @for (opt of statusOptions; track opt.label) {
        <button
          type="button"
          class="segmented-tab"
          [class.active]="selectedStatus === opt.value"
          (click)="statusChange.emit(opt.value)">
          {{ opt.label }}
        </button>
      }
    </div>
  </div>
</div>
