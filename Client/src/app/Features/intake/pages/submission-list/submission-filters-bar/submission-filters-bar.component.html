<div class="filters-bar">
  <!-- Unified Search + Controls Row -->
  <div class="filters-unified-row">
    <!-- Search Input with colored left border -->
    <div class="filters-search-wrap">
      <i class="pi pi-search filters-search-icon" aria-hidden="true"></i>
      <input
        type="text"
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchInput($event)"
        [placeholder]="'FILTERS_BAR.SEARCH_PLACEHOLDER' | translate"
        class="filters-search-input"
        [attr.aria-label]="'FILTERS_BAR.SEARCH_ARIA' | translate"
      />

      @if (searchTerm) {
        <button
          type="button"
          (click)="onClearSearch()"
          class="filters-clear-btn"
          [title]="'FILTERS_BAR.CLEAR_SEARCH' | translate"
          [attr.aria-label]="'FILTERS_BAR.CLEAR_SEARCH' | translate"
        >
          <i class="pi pi-times"></i>
        </button>
      }
    </div>

    <!-- Sort & View Toggle Group -->
    @if (mode === 'archive') {
      <div class="filters-controls-group">
        <!-- Sort Select -->
        <div class="filters-sort-wrap">
          <i class="pi pi-sort-alt filters-sort-icon"></i>
          <select
            [ngModel]="sortOption"
            (ngModelChange)="onSortSelect($event)"
            class="filters-sort-select"
            [attr.aria-label]="'FILTERS_BAR.SORT_ARIA' | translate"
          >
            <option value="newest">{{ 'FILTERS_BAR.SORT_NEWEST' | translate }}</option>
            <option value="oldest">{{ 'FILTERS_BAR.SORT_OLDEST' | translate }}</option>
            <option value="name">{{ 'FILTERS_BAR.SORT_NAME' | translate }}</option>
            <option value="pain">{{ 'FILTERS_BAR.SORT_PAIN' | translate }}</option>
          </select>
        </div>

        <!-- View Toggle -->
        <div
          class="filters-view-group"
          role="group"
          [attr.aria-label]="'FILTERS_BAR.VIEW_TOGGLE_ARIA' | translate"
        >
          <button
            type="button"
            class="filters-view-btn"
            [class.active]="viewMode === 'cards'"
            (click)="onViewModeToggle('cards')"
            [title]="'FILTERS_BAR.VIEW_CARDS' | translate"
            [attr.aria-label]="'FILTERS_BAR.VIEW_CARDS' | translate"
          >
            <i class="pi pi-th-large"></i>
          </button>
          <button
            type="button"
            class="filters-view-btn"
            [class.active]="viewMode === 'table'"
            (click)="onViewModeToggle('table')"
            [title]="'FILTERS_BAR.VIEW_TABLE' | translate"
            [attr.aria-label]="'FILTERS_BAR.VIEW_TABLE' | translate"
          >
            <i class="pi pi-list"></i>
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Status Filter Chips -->
  <div class="filters-chips-row">
    <div class="filters-chips-scroll">
      @for (opt of statusOptions; track opt.label) {
        <button
          type="button"
          class="filters-chip"
          [class.active]="selectedStatus === opt.value"
          (click)="onStatusSelect(opt.value)"
        >
          <span>{{ opt.label }}</span>
          @if (opt.count !== undefined) {
            <span class="filters-chip-count">{{ opt.count }}</span>
          }
        </button>
      }
    </div>

    @if (searchTerm || selectedStatus !== null) {
      <button
        type="button"
        (click)="clearFilters.emit()"
        class="filters-clear-chip"
        [title]="'FILTERS_BAR.RESET_FILTERS' | translate"
      >
        <i class="pi pi-filter-slash"></i>
        <span>{{ 'FILTERS_BAR.RESET' | translate }}</span>
      </button>
    }
  </div>
</div>
