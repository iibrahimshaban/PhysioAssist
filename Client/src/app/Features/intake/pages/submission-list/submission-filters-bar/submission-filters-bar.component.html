<div class="filters-bar">
  <!-- Unified Search + Controls Row -->
  <div class="filters-unified-row">
    <!-- Search Input with colored left border -->
    <div class="filters-search-wrap">
      <i class="pi pi-search filters-search-icon" aria-hidden="true"></i>
      <input
        type="text"
        [ngModel]="searchTerm"
        (ngModelChange)="onSearchInput($event)"
        [placeholder]="'intake.submissions.filters.searchPlaceholder' | transloco"
        class="filters-search-input"
        [attr.aria-label]="'intake.submissions.filters.searchAria' | transloco" />

      @if (searchTerm) {
        <button
          type="button"
          (click)="onClearSearch()"
          class="filters-clear-btn"
          [title]="'intake.submissions.filters.clearSearch' | transloco"
          [attr.aria-label]="'intake.submissions.filters.clearSearchText' | transloco">
          <i class="pi pi-times"></i>
        </button>
      }
    </div>

    <!-- Sort & View Toggle Group -->
    @if (mode === 'archive') {
      <div class="filters-controls-group">
        <!-- Sort Select -->
        <div class="filters-sort-wrap">
          <i class="pi pi-sort-alt filters-sort-icon"></i>
          <select
            [ngModel]="sortOption"
            (ngModelChange)="onSortSelect($event)"
            class="filters-sort-select"
            [attr.aria-label]="'intake.submissions.filters.sortAria' | transloco">
            <option value="newest">{{ 'intake.submissions.filters.sortNewestFirst' | transloco }}</option>
            <option value="oldest">{{ 'intake.submissions.filters.sortOldestFirst' | transloco }}</option>
            <option value="name">{{ 'intake.submissions.filters.sortPatientName' | transloco }}</option>
            <option value="pain">{{ 'intake.submissions.filters.sortPainRegions' | transloco }}</option>
          </select>
        </div>

        <!-- View Toggle -->
        <div class="filters-view-group" role="group" [attr.aria-label]="'intake.submissions.filters.viewModeGroupAria' | transloco">
          <button
            type="button"
            class="filters-view-btn"
            [class.active]="viewMode === 'cards'"
            (click)="onViewModeToggle('cards')"
            [title]="'intake.submissions.filters.gridViewTitle' | transloco"
            [attr.aria-label]="'intake.submissions.filters.gridViewAria' | transloco">
            <i class="pi pi-th-large"></i>
          </button>
          <button
            type="button"
            class="filters-view-btn"
            [class.active]="viewMode === 'table'"
            (click)="onViewModeToggle('table')"
            [title]="'intake.submissions.filters.listViewTitle' | transloco"
            [attr.aria-label]="'intake.submissions.filters.listViewAria' | transloco">
            <i class="pi pi-list"></i>
          </button>
        </div>
      </div>
    }
  </div>

  <!-- Status Filter Chips -->
  <div class="filters-chips-row">
    <div class="filters-chips-scroll">
      @for (opt of statusOptions; track opt.label) {
        <button
          type="button"
          class="filters-chip"
          [class.active]="selectedStatus === opt.value"
          (click)="onStatusSelect(opt.value)">
          <span>{{ opt.label | transloco }}</span>
          @if (opt.count !== undefined) {
            <span class="filters-chip-count">{{ opt.count }}</span>
          }
        </button>
      }
    </div>

    @if (searchTerm || selectedStatus !== null) {
      <button
        type="button"
        (click)="clearFilters.emit()"
        class="filters-clear-chip"
        [title]="'intake.submissions.filters.clearAllTitle' | transloco">
        <i class="pi pi-filter-slash"></i>
        <span>{{ 'intake.common.reset' | transloco }}</span>
      </button>
    }
  </div>
</div>
