<div class="min-h-screen bg-[#f5fafc]">
  <app-session-header [session]="sessionDetails()"></app-session-header>

  <main
    class="mx-auto mt-5 grid max-w-[1100px] grid-cols-1 gap-5 px-4 pb-8 sm:px-6 lg:grid-cols-12"
  >
    <!-- Main session content -->
    <section class="lg:col-span-8">
      <!-- Session notes -->
      <app-session-notes
        [notes]="notes()"
        [audioFileUrl]="sessionDetails()?.audioFileUrl ?? null"
        [isOpen]="notesOpen()"
        [isRecording]="isRecording()"
        [isPaused]="isPaused()"
        [recordingSeconds]="recordingSeconds()"
        [isUploadingAudio]="isUploadingAudio()"
        (notesChange)="onNotesChanged($event)"
        (toggle)="toggleNotes()"
        (record)="startRecording()"
        (pause)="pauseRecording()"
        (resume)="resumeRecording()"
        (stop)="stopRecording()"
        (cancel)="cancelRecording()"
      ></app-session-notes>

      <!-- Treatment plan -->
      <app-treatment-plan
        class="mt-4 block"
        [isOpen]="treatmentPlanOpen()"
        [plan]="treatmentPlan()"
        (toggle)="toggleTreatmentPlan()"
        (planChange)="onTreatmentPlanChanged($event)"
      />

      <!-- Session information -->
      <app-session-info
        class="mt-4"
        [session]="sessionDetails()"
        [isOpen]="sessionInfoOpen()"
        (toggle)="toggleSessionInfo()"
      ></app-session-info>

      <!-- Attachments -->
      <app-session-attachments
        class="mt-4"
        [attachments]="visibleAttachments()"
        [(selectedFiles)]="selectedAttachmentFiles"
        (deleteUploaded)="stageAttachmentForDeletion($event)"
      ></app-session-attachments>


      <!-- Actions -->
      <app-session-actions
        class="mt-4"
        [isSaving]="isSavingDraft()"
        [isCompleting]="isCompletingSession()"
        (save)="saveDraft()"
        (complete)="completeSession()"
      ></app-session-actions>
    </section>

    @if (sessionDetails(); as session) {
      <app-next-session-booking
        class="mt-4 block lg:sticky lg:top-5 lg:col-span-4 lg:mt-0 lg:self-start"
        [sessionId]="session.id"
        [patientId]="session.PatientId"
      />
    }
  </main>

  <!-- Recording modal -->
  @if (isRecordingModalOpen()) {
    <app-recording-modal
      [seconds]="recordingSeconds()"
      [isUploading]="isUploadingAudio()"
      (stop)="stopRecording()"
      (cancel)="cancelRecording()"
    />
  }
</div>
