<div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
  <button
    type="button"
    role="button"
    (click)="onSave()"
    [disabled]="isSaving() || isCompleting()"
    class="rounded-xl border border-slate-200 bg-white py-4 font-semibold shadow-sm transition cursor-pointer hover:bg-slate-50 disabled:cursor-not-allowed disabled:opacity-60"
  >
    @if (isSaving()) {
      <span
        class="mr-2 inline-block h-5 w-5 animate-spin rounded-full border-2 border-[#0B8EEA] border-t-transparent"
      ></span>
      Saving...
    } @else {
      Save draft
    }
  </button>

  <button
    type="button"
    (click)="onComplete()"
    [disabled]="isCompleting() || isSaving()"
    class="rounded-xl bg-[#0B8EEA] py-4 font-semibold text-white shadow-sm transition cursor-pointer disabled:cursor-not-allowed disabled:opacity-60"
  >
    @if (isCompleting()) {
      <span
        class="mr-2 inline-block h-5 w-5 animate-spin rounded-full border-2 border-white border-t-transparent"
      ></span>
      Completing...
    } @else {
      Complete & Generate Summary
    }
  </button>
</div>
